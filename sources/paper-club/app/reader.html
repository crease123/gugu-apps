<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>论文共读</title>
<link rel="stylesheet" href="reader.css" />
</head>
<body>
  <header class="bar" id="bar">
    <button id="back" type="button" hidden><gugu-icon name="chevron-left"></gugu-icon></button>
    <strong id="title" class="title"></strong>
    <span id="readers" class="readers"></span>
    <span class="spacer"></span>
    <small id="pageno" class="muted pageno"></small>
    <button id="import-toggle" type="button"><gugu-icon name="import"></gugu-icon></button>
    <button id="box-toggle" type="button" aria-pressed="false"><gugu-icon name="focus"></gugu-icon></button>
    <button id="zoom-out" type="button" class="zoom">−</button>
    <button id="zoom-in" type="button" class="zoom">+</button>
    <button id="side-toggle" type="button" aria-pressed="false"><gugu-icon name="library"></gugu-icon><span id="side-toggle-label"></span></button>
  </header>
  <form id="import-box" class="row import-box" hidden>
    <input id="import-ref" type="search" autocomplete="off" />
    <button id="import-go" class="primary" type="submit"></button>
    <button id="import-upload" type="button"></button>
  </form>
  <div id="ask-pick" class="row ask-pick" hidden></div>
  <p id="banner" class="banner" role="status" hidden></p>
  <main class="layout" id="layout">
    <div id="pages" class="pages" tabindex="0"></div>
    <aside id="side" class="side" hidden>
      <div role="tablist" class="tabs" id="tabs">
        <button role="tab" data-tab="highlights" aria-selected="true" id="tab-highlights"></button>
        <button role="tab" data-tab="cards" aria-selected="false" id="tab-cards"></button>
        <button role="tab" data-tab="about" aria-selected="false" id="tab-about"></button>
      </div>
      <section id="side-body" class="side-body"></section>
    </aside>
  </main>
  <div id="sel-bar" class="sel-bar" role="toolbar" hidden>
    <span id="sel-colors" class="sel-colors"></span>
    <button id="sel-comment" type="button"><gugu-icon name="message-square"></gugu-icon><span id="sel-comment-label"></span></button>
    <button id="sel-ask" type="button" class="primary"><gugu-icon name="bot"></gugu-icon><span id="sel-ask-label"></span></button>
    <button id="sel-copy" type="button"><gugu-icon name="copy"></gugu-icon></button>
  </div>
  <script type="module" src="reader.js"></script>
</body>
</html>
